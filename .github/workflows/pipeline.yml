name: Daily Baby Steps Learning Pipeline

on:
  schedule:
    # Runs every day at 03:30 UTC (adjust if needed)
    - cron: "30 3 * * *"

  # Allows manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # ✅ allow committing back to the repo

    timeout-minutes: 60

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: 📚 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run daily video pipeline
        run: |
          python run_pipeline.py

      - name: Commit updated topics
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add memory/recent_formats.json
          git add memory/recent_topics.json
          git diff --cached --quiet || git commit -m "Update used topics & formats"
          git push


      - name: 📁 Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          path: |
            *.log
            logs/
