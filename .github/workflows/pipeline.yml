name: YouTube Kids Pipeline

on:
  schedule:
    # Monday: 1 run (11:00 IST)
    - cron: "30 5 * * 1"

    # Tuesday: 2 runs (08:00, 20:00 IST)
    - cron: "30 2,14 * * 2"

    # Wednesday: 1 run (16:00 IST)
    - cron: "30 10 * * 3"

    # Thursday: 2 runs (09:00, 21:00 IST)
    - cron: "30 3,15 * * 4"

    # Friday: 1 run (13:00 IST)
    - cron: "30 7 * * 5"

    # Saturday: 2 runs (10:00, 18:00 IST)
    - cron: "30 4,12 * * 6"

    # Sunday: 1 run (19:00 IST)
    - cron: "30 13 * * 0"

  workflow_dispatch:

concurrency:
  group: youtube-kids-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    timeout-minutes: 180

    env:
      GROQCLOUD_API_KEY: ${{ secrets.GROQCLOUD_API_KEY }}
      GROQCLOUD_KEYS: ${{ secrets.GROQCLOUD_KEYS }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      PIPER_EXECUTABLE: piper
      PIPER_MODEL_PATH: voices/en_US-amy-medium.onnx
      PIPER_LENGTH_SCALE: "1.35"
      CAPTIONS_ENABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate required secrets
        run: |
          python - <<'PY'
          import os
          required = [
              "YOUTUBE_CLIENT_ID",
              "YOUTUBE_CLIENT_SECRET",
              "YOUTUBE_REFRESH_TOKEN",
              "KAGGLE_USERNAME",
              "KAGGLE_KEY",
              "HF_TOKEN",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if not (os.getenv("GROQCLOUD_API_KEY") or os.getenv("GROQCLOUD_KEYS")):
              missing.append("GROQCLOUD_API_KEY or GROQCLOUD_KEYS")
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))
          print("Required secrets are present.")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Piper Amy voice
        run: |
          mkdir -p voices
          if [ ! -f voices/en_US-amy-medium.onnx ]; then
            curl -L -o voices/en_US-amy-medium.onnx \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx"
          fi
          if [ ! -f voices/en_US-amy-medium.onnx.json ]; then
            curl -L -o voices/en_US-amy-medium.onnx.json \
              "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/amy/medium/en_US-amy-medium.onnx.json"
          fi

      - name: Run full video pipeline
        run: |
          python run_pipeline.py

      - name: Commit updated memory
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add memory/recent_formats.json
          git add memory/recent_topics.json
          git diff --cached --quiet || git commit -m "Update used topics & formats"
          git push

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs
          if-no-files-found: ignore
          path: |
            *.log
            logs/
            generated/
            .kaggle_runs/
